<script>
  // if Kamiel can't start, say why on the screen instead of staying black
  window.onerror = function (msg, src, line) {
    var d = document.getElementById('kerr');
    if (!d) { d = document.createElement('div'); d.id = 'kerr'; d.style.cssText = 'position:fixed;left:3vw;bottom:4vh;right:3vw;z-index:99;font:16px monospace;color:#fff;background:rgba(160,0,0,.85);padding:12px;white-space:pre-wrap'; (document.body || document.documentElement).appendChild(d); }
    d.textContent += 'Kamiel kon niet starten: ' + msg + ' (' + String(src).split('/').pop() + ':' + line + ')\n';
    window.tlog && window.tlog('fout', msg + ' (' + String(src).split('/').pop() + ':' + line + ')');
  };
  // a line in the logbook of Kamiel Studio
  window.tlog = function (kind, text) {
    try { fetch('api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: kind, text: String(text).slice(0, 200) }) }).catch(function () {}); } catch (e) { }
  };
  window.addEventListener('unhandledrejection', function (e) { window.onerror(String(e.reason && e.reason.message || e.reason), 'display', 0); });
</script>

  const dr = deskEl.getBoundingClientRect(), DW = dr.width, DH = dr.height - 54, tidy = (S.window_layout || 'verspreid') === 'netjes';
  const gap = tidy ? 10 : -16, M = 10, placed = [];

      for (let y = M; y + it.h <= Math.max(M + 1, DH); y += 24) for (let x = M; x + it.w <= DW - M; x += 24) {

/* ---------- tapping: message, sun, moon, an element, or the empty scene ---------- */
const post = (u) => fetch(u, { method: 'POST' }).catch(() => {});
document.addEventListener('pointerup', (e) => {
  if (e.target.closest && e.target.closest('.win, .taskbar')) return;   // the windows handle their own taps
  if (deskOpen) { closeDesk(); return; }                                // tapping the scene closes them
  const r = cv.getBoundingClientRect(), sc = Math.max(r.width / W, r.height / H);
  const x = (e.clientX - r.left - (r.width - W * sc) / 2) / sc, y = (e.clientY - r.top - (r.height - H * sc) / 2) / sc;
  // tapping the sent photo: it goes away and the sender hears it was seen
  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k];
    if (hh.it.spot && x >= hh.x && x <= hh.x + hh.w && y >= hh.y && y <= hh.y + hh.h) {
      if (spotlight) post('api/photo-seen/' + spotlight.id);
      dropSpot(); return;
    }
  }
  if (EV.tapPet(x, y)) return;   // a housemate lying in the scene: a pat on the head
  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k];
    if (hh.it.door && x >= hh.x && x <= hh.x + hh.w && y >= hh.y && y <= hh.y + hh.h) { dropSign('door'); return; }
  }
  if (message && msgAlpha > .3) { dismissed.add(message.id); post('api/seen/' + message.id); message = null; return; }   // "read it"
  if (remShown && remAlpha > .3) {   // a reminder: gone until its next time
    const key = KamielReminder.occurrence(remShown, now());
    remDismissed[remShown.id] = key;
    fetch('api/reminder-dismiss/' + remShown.id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) }).catch(() => {});
    remShown = null; return;
  }
  // the clock (top left) opens the departure board; tapping the board closes it
  const ob = document.getElementById('osd').getBoundingClientRect();
  if (e.clientX >= ob.left - 20 && e.clientX <= ob.right + 20 && e.clientY >= ob.top - 20 && e.clientY <= ob.top + ob.height * .55 + 20) {
    if (board) hideBoard(); else showBoard();
    return;
  }
  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k];
    if (hh.it.board && x >= hh.x && x <= hh.x + hh.w && y >= hh.y && y <= hh.y + hh.h) { hideBoard(); return; }
  }
  const near = (p, rad) => p && Math.hypot(x - p.x, y - p.y) < rad;
  if (S.sun_script && near(sunXY, 70)) { ring = { x: sunXY.x, y: sunXY.y, t0: performance.now() }; post('api/tap/sun'); return; }
  if (S.moon_script && near(moonXY, 60)) { ring = { x: moonXY.x, y: moonXY.y, t0: performance.now() }; post('api/tap/moon'); return; }
  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k], tap = hh.it.o.tap;
    if (!tap || tap.action === 'niets' || x < hh.x || x > hh.x + hh.w || y < hh.y || y > hh.y + hh.h) continue;
    if (tap.action === 'vertrek') { showBoard(); return; }
    if (tap.action === 'script') { ring = { x, y, t0: performance.now() }; post('api/tap/el-' + hh.it.o.id); return; }
  }
  // Kamiel himself: his wardrobe
  const kw = 128, kxs = W / 2 - kw / 2;
  if (S.kamiel_tap !== 'niets' && WIN.kleerkast !== false && x > kxs && x < kxs + kw && y > FEET - 225 && y < FEET) { openDesk(['kleerkast']); return; }
  const act = S.empty_tap || 'vensters';
  if (act === 'vensters') { openDesk(); return; }
  if (act === 'vertrek') showBoard();
  else if (act === 'url' && S.tap_url) location.href = S.tap_url;
});
pollLive(); setInterval(pollLive, 5000);
try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { }
})();
</script>
