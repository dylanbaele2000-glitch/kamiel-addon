<!doctype html>
<html lang="nl">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Titan+One&family=Arimo:wght@700&display=swap">

<style>

.b95:active,.b95.on{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px 0 #808080;background:#b5b5b5}

<body>

<script>

// lowest ground point (largest y) between two x positions: an object standing there is never floating,

const OBJ = world.assets.filter(a => a.kind !== 'wolk' && a.active !== false).map(a => {

// the music tv: your own frame marked "tv", or a built-in retro set

}

const FRAMES = OBJ.filter(o => o.kind === 'kader' && !o.tv && o.hole);
const FRAME = () => FRAMES.length ? FRAMES[Math.floor(rnd() * FRAMES.length)] : (FRAME.builtin || (FRAME.builtin = builtinFrame()));

const TVS = OBJ.filter(o => o.tv && o.kind === 'kader' && o.hole);

const photoCache = {};
const photoImg = (url) => photoCache[url] || (photoCache[url] = load(url));
const WORDS = S.words && S.words.length ? S.words : ['WELKOM IN KAMIELLAND'];

/* ---------- time, sun, moon, weather ---------- */
let weather = params.get('w') || 'licht', haSun = null, wind = 4, osdLines = [], cloudCover = null;
const rainy = () => weather === 'regen' || weather === 'onweer';
const WEATHER_BUCKET = { helder: 'zon', licht: 'zon', bewolkt: 'bewolkt', regen: 'regen', onweer: 'regen', sneeuw: 'sneeuw', mist: 'mist' };

  const d = new Date();
  const dd = params.get('d'); if (dd) { const [y, mo, da] = dd.split('-').map(Number); d.setFullYear(y, mo - 1, da); }

  return d;
}
const minutesOf = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return (h || 0) * 60 + (m || 0); };

  return a > b ? (m >= a || m < b) : (m >= a && m < b);

/* ---------- seasons and holidays ---------- */
function easter(y) {   // Gregorian computus
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
const md = (d) => String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const between = (x, a, b) => a <= b ? (x >= a && x <= b) : (x >= a || x <= b);   // "MM-DD", may wrap over new year
const PERIOD_DATES = { lente: ['03-21', '06-20'], zomer: ['06-21', '09-22'], herfst: ['09-23', '12-20'], winter: ['12-21', '03-20'],
  valentijn: ['02-07', '02-14'], halloween: ['10-15', '11-01'], sinterklaas: ['11-15', '12-06'], kerst: ['12-01', '01-06'], nieuwjaar: ['12-28', '01-02'] };
function inPeriod(name, d, from, to) {

  if (name === 'pasen') { const e = easter(d.getFullYear()), a = new Date(e), b = new Date(e); a.setDate(e.getDate() - 7); b.setDate(e.getDate() + 1); return d >= a && d < new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1); }
  const r = PERIOD_DATES[name]; return r ? between(x, r[0], r[1]) : true;

function horizontal(days, ra, dec) {
  const rad = Math.PI / 180, phi = rad * LAT, th = rad * (280.16 + 360.9856235 * days) + rad * LON, Hh = th - ra;

const light = (alt) => Math.max(0, Math.min(1, (alt + 8) / 18));
const tintFor = (alt) => Math.max(0, 1 - Math.abs(alt - 2) / 10);

async function pollState() {
  try {
    const s = await (await fetch('api/state', { cache: 'no-store' })).json();

    const cov = typeof s.clouds === 'number' ? s.clouds : null;

    }

async function pollWorld() {
  try {
    const w = await (await fetch('api/world', { cache: 'no-store' })).json();
    if (w.version !== world.version) location.reload();
  } catch (e) { }
}

let seasonNow = '', halloweenNow = false, kerstNow = false, fireworksNow = false;
function updateSeason() {
  const d = now();

updateSeason();
const SEASON_TINT = { lente: 'rgba(255,170,215,.05)', zomer: 'rgba(255,225,140,.05)', herfst: 'rgba(255,135,40,.07)', winter: 'rgba(205,225,255,.08)' };

/* ---------- composing each place ---------- */
const places = [];
const recent = [];
function pickFrom(list) {

  const w = list.map(o => (o.rare === 'zeldzaam' ? 0.25 : o.rare === 'heelzeldzaam' ? 0.06 : 1) * (o.period && o.period !== 'altijd' ? 3 : 1) * (o.weather && o.weather.length ? 3 : 1));
  let r = rnd() * w.reduce((a, b) => a + b, 0);

  return list[list.length - 1];
}
function compose(i) {
  const night = isNightTime(now());

  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k];
    if (hh.it.board && x >= hh.x && x <= hh.x + hh.w && y >= hh.y && y <= hh.y + hh.h) { hideBoard(); return; }
  }
  const near = (p, rad) => p && Math.hypot(x - p.x, y - p.y) < rad;
  if (S.sun_script && near(sunXY, 70)) { ring = { x: sunXY.x, y: sunXY.y, t0: performance.now() }; post('api/tap/sun'); return; }
  if (S.moon_script && near(moonXY, 60)) { ring = { x: moonXY.x, y: moonXY.y, t0: performance.now() }; post('api/tap/moon'); return; }
  for (let k = hits.length - 1; k >= 0; k--) {
    const hh = hits[k], tap = hh.it.o.tap;
    if (!tap || tap.action === 'niets' || x < hh.x || x > hh.x + hh.w || y < hh.y || y > hh.y + hh.h) continue;
    if (tap.action === 'vertrek') { showBoard(); return; }
    if (tap.action === 'script') { ring = { x, y, t0: performance.now() }; post('api/tap/el-' + hh.it.o.id); return; }
  }
  // Kamiel himself: his wardrobe
  const kw = 128, kxs = W / 2 - kw / 2;
  if (S.kamiel_tap !== 'niets' && WIN.kleerkast !== false && x > kxs && x < kxs + kw && y > FEET - 225 && y < FEET) { openDesk(['kleerkast']); return; }
  const act = S.empty_tap || 'vensters';
  if (act === 'vensters') { openDesk(); return; }
  if (act === 'vertrek') showBoard();
  else if (act === 'url' && S.tap_url) location.href = S.tap_url;
});
pollLive(); setInterval(pollLive, 5000);
try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { }
})();
</script>
